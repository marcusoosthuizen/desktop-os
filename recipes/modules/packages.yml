# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    repos:
      nonfree: negativo17
      files:
        - terra.repo
    install:
      install-weak-deps: false
      packages:
        - noctalia
        - niri
        - adw-gtk3-theme # gtk theme
        - papirus-icon-theme # icon theme
        - imv
        - foot
        - mpv
        - nautilus
        - file-roller-nautilus # file roller support
        - gvfs-mtp # MTP support for GVFS
        - xdg-user-dirs # default folders
        - steam
        - zed
        - discord
        - zen-browser
      exclude:
        - alacritty
        - waybar
        - fuzzel
        - swaylock
    remove:
      packages:
        - firefox
        - firefox-langpacks

  # latex stuff
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - aspell-en # spell check
        - texlive # latex
        - biber # bibtex replacement

  # cmd utils
  - type: dnf
    repos:
      files:
        - terra.repo
    install:
      install-weak-deps: false
      packages:
        - mise # dev env manager
        - mise-bash-completion # completion for mise
        - tailscale # accessing homelab
        - tldr # man but shorter
        - fantasquesansmono-nerd-fonts # epic font
