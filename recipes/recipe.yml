---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: desktop-os
description: This is my personal OS image for my thinkpad.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/base-main
image-version: latest # IMAGE VERSION

# module configuration, executed in order
modules:

  # swayfx & noctalia
  - type: dnf
    repos:
      copr:
        - swayfx/swayfx
    install:
      packages:
        - swayfx
        - noctalia

  - type: dnf
    repos:
      nonfree: rpmfusion
      copr:
        - atim/starship
        - dejan/lazygit
      files:
        - https://repo.librewolf.net/librewolf.repo
    install:
      packages:
        - starship
        - cascadia-mono-nf-fonts # for foot & starship
        - thunar
        - gvfs-mtp # MTP support for GVFS
        - thunar-volman # auto USB management for thunar
        - tumbler # thumbnail support for thunar
        - adw-gtk3-theme # gtk theme
        - papirus-icon-theme # icon theme
        - xdg-user-dirs # default folders
        - imv
        - mpv
        - helix
        - lazygit
        - librewolf
        - pipx # for pywalfox installation
        - steam
    remove:
      packages:
        - firefox
        - firefox-langpacks
        - vim-common
        - vim-data
        - vim-enhanced
        - vim-filesystem
        - vim-minimal

  - type: script
    snippets:
      - "wget -qO- https://git.io/papirus-folders-install | sh" # papirus folders
      - "papirus-folders -t Papirus-Dark -C yaru" # setting default papirus folders theme
    scripts:
      - millenium.sh

  - type: brew
    nofile-limits: true # increase nofile limits
    brew-analytics: false # disable telemetry

  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: chezmoi
    repository: "https://github.com/marcusoosthuizen/dotfiles" # my dotfiles repo
    file-conflict-policy: replace # override changed files with those from the repo
    disable-update: true

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
